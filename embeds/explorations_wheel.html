<style>
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    max-height:100%;
    background:transparent;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
  }
  #wheel{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    display:block;
    touch-action:none;
    pointer-events:none;
  }
  text{font-family:Georgia,serif}
  .ring{
    transform-box: view-box;
    transform-origin: var(--c) var(--c);
    animation: spin var(--dur) linear infinite;
    animation-direction: var(--dir);
    will-change: transform;
  }
  @keyframes spin{
    from{transform: rotate(var(--start))}
    to  {transform: rotate(calc(var(--start) + 360deg))}
  }
</style>

const LOGOFIT = 0.95;
const SPEED = 4;

const SAT = 68, LIGHT = 45;
const SEPCOLOR = "#1a1a1a";

const ITEMS = [
  "The world \u2018within\u2019","Sense of place","Sky and earth","Light and shadows",
  "Soil","Rocks","Mountains","Water","Plants","Animals","People","Places",
  "Body","Food","Health",

];

const COLORS = (() => {
  const n = ITEMS.length, off = Math.random()*360;
  const hues = [...Array(n)].map((_,i) => (off + i*360/n) % 360);
  for (let i=hues.length-1;i>0;i--){
    const j=(Math.random()*(i+1))|0; [hues[i],hues[j]]=[hues[j],hues[i]];
  }
  return hues.map(h => {
    const dip = Math.max(0, 1 - Math.abs(((h-55+180)%360)-180)/45);
    return `hsl(${h.toFixed(1)},${SAT}%,${(LIGHT - dip*10).toFixed(1)}%)`;
  });
})();

const NS = "http://www.w3.org/2000/svg";
const svg  = document.getElementById("wheel");
const defs = document.getElementById("paths");
const host = document.getElementById("rings");
const logo = document.getElementById("logo");

const ruler = document.createElementNS(NS,"text");
ruler.setAttribute("visibility","hidden");
ruler.setAttribute("x","-99999");
ruler.setAttribute("font-size",REF);
svg.appendChild(ruler);
const measure = s => { ruler.textContent = s; return ruler.getComputedTextLength(); };

const snapshot = () => ITEMS.map(measure).map(x => Math.round(x)).join(",");

function waitForFont(tries, prev){
  const sig = snapshot();
  if (sig === prev || tries <= 0) return build();
  setTimeout(() => waitForFont(tries - 1, sig), 120);
}

function build(){
  const wRef = ITEMS.map(measure), sepRef = measure(SEP);
  const N = ITEMS.length;

  function layout(F){
    const k = F/REF, minsep = MINGAP*F;
    const w = wRef.map(x => x*k);
    const pre = [0];
    for (let t=0;t<N;t++) pre.push(pre[t] + w[t]);

    for (let n=MINRINGS; n<=MAXRINGS; n++){
      const L = [...Array(n)].map((_,j) => 2*Math.PI*(R0 + j*GAP));
      const dp = [...Array(n+1)].map(() => new Array(N+1).fill(Infinity));
      const bk = [...Array(n+1)].map(() => new Array(N+1).fill(-1));
      dp[0][0] = 0;

      for (let j=1;j<=n;j++)
        for (let i=1;i<=N;i++)
          for (let a=0;a<i;a++){
            if (dp[j-1][a] === Infinity) continue;
            const cnt = i-a, gap = (L[j-1] - (pre[i]-pre[a])) / cnt;
            if (gap < minsep) continue;
            const c = dp[j-1][a] + cnt*gap*gap;
            if (c < dp[j][i]){ dp[j][i] = c; bk[j][i] = a; }
          }

      if (dp[n][N] < Infinity){
        const cuts = []; let i = N;
        for (let j=n;j>=1;j--){ const a = bk[j][i]; cuts.unshift([a,i]); i = a; }
        return { F, n, cuts, w };
      }
    }
    return null;
  }

  let plan = null, F = MAXFONT;
  while (F > 6 && !(plan = layout(F))) F *= 0.97;
  if (!plan) return;

  F = plan.F;
  const { n, cuts, w } = plan, k = F/REF;
  const C = R0 + (n-1)*GAP + F*0.9;
  const D = (2*C).toFixed(0);
  svg.setAttribute("viewBox", `0 0 ${D} ${D}`);
  svg.style.setProperty("--c", C.toFixed(1) + "px");

  const side = (R0 - F*0.7) * LOGOFIT;
  logo.setAttribute("href", LOGO);
  logo.setAttribute("x", (C - side).toFixed(1));
  logo.setAttribute("y", (C - side).toFixed(1));
  logo.setAttribute("width",  (side*2).toFixed(1));
  logo.setAttribute("height", (side*2).toFixed(1));

  const frag = document.createDocumentFragment();

  cuts.forEach(([a,b], j) => {
    const r = R0 + j*GAP, id = "p" + j;

    const p = document.createElementNS(NS,"path");
    p.setAttribute("id", id);
    p.setAttribute("fill","none");
    p.setAttribute("d",
      `M${C},${C} m-${r},0 a${r},${r} 0 1,1 ${2*r},0 a${r},${r} 0 1,1 -${2*r},0`);
    defs.appendChild(p);

    const L = p.getTotalLength(), cnt = b - a, sepW = sepRef*k;
    let sumw = 0; for (let t=a;t<b;t++) sumw += w[t];
    const gap = (L - sumw) / cnt;

    const g = document.createElementNS(NS,"g");
    g.setAttribute("class","ring");
    g.style.setProperty("--start", (Math.random()*360).toFixed(1) + "deg");
    g.style.setProperty("--dur",   (r/SPEED).toFixed(1) + "s");
    g.style.setProperty("--dir",   j % 2 ? "reverse" : "normal");

    const t = document.createElementNS(NS,"text");
    t.setAttribute("font-size", F.toFixed(2));

    const put = (s, dist, color) => {
      const tp = document.createElementNS(NS,"textPath");
      tp.setAttribute("href", "#" + id);
      tp.setAttribute("startOffset", (((dist % L + L) % L) / L * 100).toFixed(4) + "%");
      tp.setAttribute("fill", color);
      tp.textContent = s;
      t.appendChild(tp);
    };

    let cur = 0;
    for (let q=a;q<b;q++){
      put(ITEMS[q], cur, COLORS[q]);
      cur += w[q];
      put(SEP, cur + gap/2 - sepW/2, SEPCOLOR);
      cur += gap;
    }

    g.appendChild(t);
    frag.appendChild(g);
  });

  host.appendChild(frag);
  ruler.remove();
}

document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.fonts.ready.then(() => waitForFont(12, null));
</script>
