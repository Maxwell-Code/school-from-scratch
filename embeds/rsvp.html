<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave an email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap">
<style>
  /* This is built on its own and shown in a frame of its own, so it can't
     take the page's colors and font: they are written out here instead, to
     match the play's page. If that page's change, change these to suit.
       background  BACKGROUND_COLOR   text  TEXT_COLOR
       font        PLAY_BODY_FONT                                        */
  :root {
    --bg: #fffef7;
    --fg: #0b1105;
    --line: #0b1105;
    --button: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 19px;
  }
  .stack { width: 100%; max-width: 460px; }
  form {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  input[type="email"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  input[type="email"]::placeholder { color: #0b110577; }
  input[type="email"]:focus-visible {
    outline: 1px solid var(--line);
    outline-offset: 1px;
  }
  button {
    flex: none;
    padding: 10px 24px;
    border: 1px solid var(--button);
    border-radius: 0;
    background: var(--button);
    color: var(--bg);
    font: inherit;
    cursor: pointer;
    transition: opacity 160ms ease;
  }
  button:hover { opacity: 0.82; }
  button:active { opacity: 0.7; }
  /* A word back, so a click doesn't just empty the box with nothing said. */
  .said {
    margin: 10px 0 0;
    font-size: 17px;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .said.show { opacity: 1; }
  @media (max-width: 460px) {
    form { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="stack">
    <form id="rsvp" novalidate>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" aria-label="Email address" required>
      <button type="submit">Submit</button>
    </form>
    <p class="said" id="said" role="status" aria-live="polite">Thank you — we'll be in touch.</p>
  </div>
<script>
  // Nothing is sent anywhere yet: the address is cleared and a word of
  // thanks is shown. When there is somewhere for it to go, that goes here.
  const form = document.getElementById('rsvp');
  const email = document.getElementById('email');
  const said = document.getElementById('said');
  let clearSaid = 0;
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!email.value.trim()) { email.focus(); return; }
    email.value = '';
    email.blur();
    said.classList.add('show');
    clearTimeout(clearSaid);
    clearSaid = setTimeout(() => said.classList.remove('show'), 4000);
  });
  // Typing again puts the message away.
  email.addEventListener('input', () => said.classList.remove('show'));
</script>
</body>
</html>
