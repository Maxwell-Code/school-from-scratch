<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap">
<style>
  /* This is built on its own and shown in a frame of its own, so it can't
     take the page's colors and font: they are written out here instead, to
     match the play's page. If that page's change, change these to suit.
       background  BACKGROUND_COLOR   text  TEXT_COLOR
       font        PLAY_BODY_FONT
     What it does when an RSVP goes through is set in settings.md, under
     this embed's name.                                                  */
  :root {
    --bg: #fffef7;
    --fg: #0b1105;
    --line: #0b1105;
    --button: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 19px;
    overflow: hidden; /* confetti is kept inside the frame */
  }
  .stack { width: 100%; max-width: 520px; position: relative; }
  form { display: flex; gap: 10px; align-items: stretch; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.wide { flex: 1 1 auto; min-width: 0; }
  .field.seats { flex: none; width: 92px; }
  label { font-size: 15px; letter-spacing: 0.02em; }
  input {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 100%;
  }
  input::placeholder { color: #0b110577; }
  input:focus-visible { outline: 1px solid var(--line); outline-offset: 1px; }
  button {
    flex: none;
    align-self: flex-end;
    padding: 10px 24px;
    border: 1px solid var(--button);
    border-radius: 0;
    background: var(--button);
    color: var(--bg);
    font: inherit;
    cursor: pointer;
    transition: opacity 160ms ease;
  }
  button:hover:not(:disabled) { opacity: 0.82; }
  button:active:not(:disabled) { opacity: 0.7; }
  button:disabled { opacity: 0.45; cursor: default; }

  /* The word back. It rolls down out from under the boxes and, a moment
     later, rolls back up out of sight. Laid out in the flow rather than
     over the top of things, so the frame grows and shrinks with it and
     nothing below is covered. */
  .drop {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--drop-ms, 320ms) cubic-bezier(0.22, 1, 0.36, 1);
  }
  .drop.open { grid-template-rows: 1fr; }
  .drop-inner { overflow: hidden; }
  .drop-words {
    padding-top: 12px;
    font-size: 19px;
    transform: translateY(-6px);
    opacity: 0;
    transition: transform var(--drop-ms, 320ms) cubic-bezier(0.22, 1, 0.36, 1),
      opacity var(--drop-ms, 320ms) ease;
  }
  .drop.open .drop-words { transform: translateY(0); opacity: 1; }
  .drop-words.wrong { font-style: italic; }

  /* The frame is a set height, so on a narrow screen the three parts wrap
     onto two rows rather than three. */
  @media (max-width: 520px) {
    form { flex-wrap: wrap; }
    .field.wide { flex: 1 1 100%; }
    .field.seats { width: 88px; }
    button { flex: 1 1 auto; padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
  <div class="stack">
    <form id="rsvp" novalidate>
      <div class="field wide">
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="you@example.com" required>
      </div>
      <div class="field seats">
        <label for="seats">Seats</label>
        <input id="seats" name="seats" type="number" min="1" max="10" step="1" value="1"
               inputmode="numeric" required>
      </div>
      <div class="trap" aria-hidden="true"
           style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" id="send">RSVP</button>
    </form>
    <div class="drop" id="drop">
      <div class="drop-inner">
        <p class="drop-words" id="words" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
<script>
  // Where the RSVP goes: a Cloudflare function living with the site
  // (functions/api/rsvp.js), which holds the key that sends the mail —
  // nothing here ever sees it.
  const WHERE_IT_GOES = '/api/rsvp';
  const MOST_SEATS = 10;

  // Handed over on the end of this page's address by settings.md, under
  // this embed's name. The numbers below are what it does if nothing is
  // said there.
  const given = new URLSearchParams(location.search);
  const asWords = (name, ifNotSaid) => (given.has(name) ? given.get(name) : ifNotSaid);
  const asNumber = (name, ifNotSaid) => {
    const value = Number(given.get(name));
    return given.has(name) && Number.isFinite(value) ? value : ifNotSaid;
  };
  const asYesOrNo = (name, ifNotSaid) => (given.has(name) ? given.get(name) !== 'false' : ifNotSaid);

  const CONFETTI = asYesOrNo('confetti', true);
  const CONFETTI_PIECES = Math.max(0, Math.min(200, asNumber('confettiPieces', 26)));
  const CONFETTI_MS = Math.max(200, asNumber('confettiMs', 1400));
  const THANK_YOU = asWords('thankYou', 'Thank you!');
  const THANK_YOU_MS = Math.max(0, asNumber('thankYouMs', 2600));
  const DROP_MS = Math.max(0, asNumber('dropMs', 320));
  document.documentElement.style.setProperty('--drop-ms', DROP_MS + 'ms');

  const form = document.getElementById('rsvp');
  const email = document.getElementById('email');
  const seats = document.getElementById('seats');
  const trap = document.getElementById('website');
  const button = document.getElementById('send');
  const drop = document.getElementById('drop');
  const words = document.getElementById('words');

  let rollUp = 0;
  function say(said, wrong) {
    if (!said) return;
    words.textContent = said;
    words.classList.toggle('wrong', !!wrong);
    drop.classList.add('open');
    clearTimeout(rollUp);
    // Something gone wrong stays up to be read and dealt with; a word of
    // thanks has been read by the time it rolls back up.
    if (!wrong && THANK_YOU_MS) {
      rollUp = setTimeout(() => drop.classList.remove('open'), THANK_YOU_MS);
    }
  }
  const putAway = () => { clearTimeout(rollUp); drop.classList.remove('open'); };

  // The frame this sits in is only as tall as the boxes, and a frame is a
  // hard edge: anything thrown inside it is cut off at the sides within a
  // few pixels, which looks like a smudge on the button rather than
  // confetti. So the page is asked to throw it instead, out over the page
  // where there is room, and told where the button is. A page that isn't
  // listening simply throws none, and nothing else changes.
  function throwConfetti() {
    if (!CONFETTI || !CONFETTI_PIECES) return;
    const from = button.getBoundingClientRect();
    parent.postMessage({
      embedConfetti: {
        x: from.left + from.width / 2,
        y: from.top + from.height / 2,
        pieces: CONFETTI_PIECES,
        ms: CONFETTI_MS,
      },
    }, '*');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const address = email.value.trim();
    const howMany = Math.round(Number(seats.value));
    if (!address || !/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(address)) {
      say('That email address does not look right.', true);
      email.focus();
      return;
    }
    if (!Number.isFinite(howMany) || howMany < 1 || howMany > MOST_SEATS) {
      say('Please choose between 1 and ' + MOST_SEATS + ' seats.', true);
      seats.focus();
      return;
    }

    button.disabled = true;
    const wasSaying = button.textContent;
    button.textContent = 'Sending';
    try {
      const answer = await fetch(WHERE_IT_GOES, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: address, seats: howMany, website: trap.value }),
      });
      const back = await answer.json().catch(() => ({}));
      if (!answer.ok || !back.ok) {
        // Words the server chose, which are meant to be read by a person.
        const known = new Error(back.error || 'That did not go through.');
        known.forReading = true;
        throw known;
      }
      email.value = '';
      seats.value = '1';
      email.blur();
      throwConfetti();
      say(THANK_YOU);
    } catch (err) {
      // Anything else — no connection, nothing at that address — comes out
      // of the browser in its own words ("Failed to fetch"), which say
      // nothing to the person reading them.
      say(err && err.forReading ? err.message
        : 'That did not go through. Please check your connection and try again.', true);
    } finally {
      button.disabled = false;
      button.textContent = wasSaying;
    }
  });

  // Typing again puts the message away.
  for (const box of [email, seats]) box.addEventListener('input', putAway);

  // How tall this needs to be depends on how wide the page is, and on
  // whether the word back is showing. Rather than the page guessing, this
  // says so, and the page sets the frame to match.
  const stack = document.querySelector('.stack');
  const tellThePage = () => {
    const tall = Math.ceil(stack.getBoundingClientRect().height);
    if (tall > 0) parent.postMessage({ embedHeight: tall }, '*');
  };
  if (window.ResizeObserver) new ResizeObserver(tellThePage).observe(stack);
  window.addEventListener('load', tellThePage);
  tellThePage();
</script>
</body>
</html>
