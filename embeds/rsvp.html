<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap">
<style>
  /* This is built on its own and shown in a frame of its own, so it can't
     take the page's colors and font: they are written out here instead, to
     match the play's page. If that page's change, change these to suit.
       background  BACKGROUND_COLOR   text  TEXT_COLOR
       font        PLAY_BODY_FONT                                        */
  :root {
    --bg: #fffef7;
    --fg: #0b1105;
    --line: #0b1105;
    --button: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 19px;
  }
  .stack { width: 100%; max-width: 520px; }
  form {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.wide { flex: 1 1 auto; min-width: 0; }
  .field.seats { flex: none; width: 92px; }
  label {
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  input {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 100%;
  }
  input::placeholder { color: #0b110577; }
  input:focus-visible { outline: 1px solid var(--line); outline-offset: 1px; }
  button {
    flex: none;
    align-self: flex-end;
    padding: 10px 24px;
    border: 1px solid var(--button);
    border-radius: 0;
    background: var(--button);
    color: var(--bg);
    font: inherit;
    cursor: pointer;
    transition: opacity 160ms ease;
  }
  button:hover:not(:disabled) { opacity: 0.82; }
  button:active:not(:disabled) { opacity: 0.7; }
  button:disabled { opacity: 0.45; cursor: default; }
  /* A word back, so a click doesn't just empty the boxes with nothing said. */
  .said {
    margin: 10px 0 0;
    min-height: 1.4em;
    font-size: 17px;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .said.show { opacity: 1; }
  .said.wrong { font-style: italic; }
  /* A box for whatever fills in forms without reading them. */
  .trap {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  /* The frame is a set height, so on a narrow screen the three parts wrap
     onto two rows rather than three: the address across the top, then the
     seats and the button side by side under it. Stacked one per row it
     would be taller than the frame it is given and be cut off. */
  @media (max-width: 520px) {
    form { flex-wrap: wrap; }
    .field.wide { flex: 1 1 100%; }
    .field.seats { width: 88px; }
    button { flex: 1 1 auto; padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
  <div class="stack">
    <form id="rsvp" novalidate>
      <div class="field wide">
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="you@example.com" required>
      </div>
      <div class="field seats">
        <label for="seats">Seats</label>
        <input id="seats" name="seats" type="number" min="1" max="10" step="1" value="1"
               inputmode="numeric" required>
      </div>
      <div class="trap" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" id="send">RSVP</button>
    </form>
    <p class="said" id="said" role="status" aria-live="polite"></p>
  </div>
<script>
  // Where the RSVP goes. This is a Cloudflare function living with the site
  // (functions/api/rsvp.js), which is what holds the key that sends the
  // mail — nothing here ever sees it. Opened straight from the folder, or
  // served by anything that isn't the real site, there is nothing at this
  // address and the form says so rather than pretending it worked.
  const WHERE_IT_GOES = '/api/rsvp';
  const MOST_SEATS = 10;

  const form = document.getElementById('rsvp');
  const email = document.getElementById('email');
  const seats = document.getElementById('seats');
  const trap = document.getElementById('website');
  const button = document.getElementById('send');
  const said = document.getElementById('said');

  let clearSaid = 0;
  function say(words, wrong) {
    said.textContent = words;
    said.classList.toggle('wrong', !!wrong);
    said.classList.add('show');
    clearTimeout(clearSaid);
    if (!wrong) clearSaid = setTimeout(() => said.classList.remove('show'), 8000);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const address = email.value.trim();
    const howMany = Math.round(Number(seats.value));
    if (!address || !/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(address)) {
      say('That email address does not look right.', true);
      email.focus();
      return;
    }
    if (!Number.isFinite(howMany) || howMany < 1 || howMany > MOST_SEATS) {
      say('Please choose between 1 and ' + MOST_SEATS + ' seats.', true);
      seats.focus();
      return;
    }

    button.disabled = true;
    const wasSaying = button.textContent;
    button.textContent = 'Sending';
    try {
      const answer = await fetch(WHERE_IT_GOES, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: address, seats: howMany, website: trap.value }),
      });
      const back = await answer.json().catch(() => ({}));
      if (!answer.ok || !back.ok) {
        // Words the server chose, which are meant to be read by a person.
        const known = new Error(back.error || 'That did not go through.');
        known.forReading = true;
        throw known;
      }
      email.value = '';
      seats.value = '1';
      email.blur();
      say('Thank you — check your email for a note from us.');
    } catch (err) {
      // Anything else — no connection, nothing at that address — comes out
      // of the browser in its own words ("Failed to fetch"), which say
      // nothing to the person reading them.
      say(err && err.forReading ? err.message
        : 'That did not go through. Please check your connection and try again.', true);
    } finally {
      button.disabled = false;
      button.textContent = wasSaying;
    }
  });

  // Typing again puts the message away.
  for (const box of [email, seats]) {
    box.addEventListener('input', () => said.classList.remove('show'));
  }

  // How tall this needs to be depends on how wide the page is: on a narrow
  // one the parts wrap onto two rows. Rather than the page guessing, this
  // says so, and the page sets the frame to match. A page that isn't
  // listening simply keeps the height it was given.
  const stack = document.querySelector('.stack');
  const tellThePage = () => {
    const tall = Math.ceil(stack.getBoundingClientRect().height);
    if (tall > 0) parent.postMessage({ embedHeight: tall }, '*');
  };
  if (window.ResizeObserver) new ResizeObserver(tellThePage).observe(stack);
  window.addEventListener('load', tellThePage);
  tellThePage();
</script>
</body>
</html>
