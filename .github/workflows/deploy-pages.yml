name: Publish school website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: school-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude='.*' --exclude='/tools/' --exclude='/functions/' --exclude='/README.md' --exclude='/_site/' ./ _site/
          test -f _site/index.html
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=the-school-from-scratch --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
