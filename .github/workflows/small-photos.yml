# Keeps assets/small/ up to date. When photos are pushed, this makes a small
# copy of any photo that hasn't got one (or whose photo has changed) and
# commits the copies back, so nobody has to remember to do it by hand.
name: Small photo copies

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - '!assets/small/**'
      - 'settings.md'
      - 'tools/make-small-photos.js'
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write

# Don't react to this workflow's own commits.
concurrency:
  group: small-photos
  cancel-in-progress: false

jobs:
  small-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the image tool
        run: npm install --no-save sharp

      - name: Make the small copies
        run: node tools/make-small-photos.js

      - name: Commit them, if anything changed
        run: |
          if [ -z "$(git status --porcelain assets/small)" ]; then
            echo "Nothing to commit: every photo already has a small copy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/small
          git commit -m "Small copies of the photos [skip ci]"
          git push
