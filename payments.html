<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="page.css">
</head>
<body data-page="Payments">
  <!-- The same menu bar as the home page's; page.js fills it in. -->
  <nav id="quick-nav" aria-label="Menu">
    <div id="quick-list"></div>
  </nav>
  <main class="payments">
    <h1 id="title">Payments</h1>
    <p class="intro" id="pay-prompt">Payments are made with Zelle.</p>

    <!-- The ways to pay, as circles: only Zelle for now. The circle
         appears, then the steps below it. payments.js runs the steps.
         Adding another <button class="pay-circle" data-method="..."> here
         with a matching step below brings the split-and-choose back. -->
    <div class="pay-stage" id="pay-stage">
      <button class="pay-circle" type="button" data-method="zelle" data-slot="1"><span class="pay-label">Zelle</span></button>
    </div>

    <!-- Zelle: how to send to the school's Zelle. -->
    <section class="pay-step" id="step-zelle" hidden>
      <h2>Paying with Zelle</h2>
      <ol>
        <li>Open your bank's app and choose Send with Zelle.</li>
        <li>Send to the Zelle tag <strong data-setting="ZELLE_RECIPIENT" data-placeholder="[the school's Zelle tag]"></strong>. Before you send, check that the name shown is <strong data-setting="ZELLE_RECIPIENT_NAME" data-placeholder="[the school's name]"></strong>.</li>
        <li>Enter the amount.</li>
        <li>In the memo, write your child's name and what the payment is for.</li>
      </ol>
    </section>

  </main>
  <script src="page.js"></script>
  <script src="payments.js"></script>
</body>
</html>
